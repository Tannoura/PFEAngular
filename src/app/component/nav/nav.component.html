<!doctype html>
<html lang="en">
<head>
  <title>Webleb</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="nav.component.scss">
</head>

<div *ngIf="!loader" class="loader">
  <div class="loader-text">Loading...</div>
  <div class="loader-bar"></div>
</div>

<body>
    <div *ngIf="loader"  class="section">
      <div class="container">
        <div class="row full-height justify-content-center">
          <div class="col-12 text-center align-self-center py-5">
            <div class="section pb-5 pt-5 pt-sm-2 text-center">
              <h6 class="mb-0 pb-3"><span>Module</span><span>Organisme</span></h6>
              <input class="checkbox" type="checkbox" id="reg-log" name="reg-log"/>
              <label for="reg-log"></label>
              <div class="card-3d-wrap mx-auto">
                <div class="card-3d-wrapper">
                  <div class="card-back">
                    <div class="center-wrap">
                      <div class="section text-center">
                        <h4 class="mb-4 pb-3">Ajouter un Organisme</h4>
                        <form (ngSubmit)="addOrganisme()">
                          <div class="form-group">
                            <input type="text" class="form-style" placeholder="Nom de l'Organisme" [(ngModel)]="nomOrganisme" [ngModelOptions]="{standalone: true}" required>
                          </div>
                          <div class="form-group mt-2">
                            <input type="text" class="form-style" placeholder="Adresse de l'Organisme" [(ngModel)]="adresseOrganisme" [ngModelOptions]="{standalone: true}" required>
                          </div>
                          <div class="form-group mt-2">
                            <input type="number" class="form-style" placeholder="Numéro de l'Organisme" [(ngModel)]="numeroOrganisme" [ngModelOptions]="{standalone: true}" required>
                          </div>
                          <div class="form-group mt-2">
                            <input  *ngIf="moduleIdhiden" type="number" class="form-style " placeholder="ID du Module" [(ngModel)]="moduleId"  [ngModelOptions]="{standalone: true}"  required>
                          </div>
                          <div class="form-group mt-2">
                            <label for="photo" class="custom-file-label">choisissez votre logo:</label>
                            <input id="photo" type="file" class="form-style custom-file-input" (change)="onFileSelected($event)" required>
                          </div>
                          <button type="submit" class="btn mt-4">Ajouter Organisme</button>
                        </form>
                      </div>
                    </div>
                  </div>
                  <div class="card-front" >
                    <div class="center-wrap">
                      <div class="section text-center">
                        <h4 class="mb-3 pb-3">Ajouter un module</h4>

                        <form (ngSubmit)="addModule()">
                          <div class="form-group">
                            <input type="text" class="form-style" placeholder="Matière du module" [(ngModel)]="module.matiere" [ngModelOptions]="{standalone: true}" required>
                          </div>
                          <div class="form-group mt-2">
                            <input type="number" class="form-style" placeholder="Durée du module en heures" [(ngModel)]="module.duree" [ngModelOptions]="{standalone: true}" required>
                          </div>
                          <div class="form-group mt-2">
                            <input type="number" class="form-style" placeholder="Prix du module" [(ngModel)]="module.prix" [ngModelOptions]="{standalone: true}" required>
                          </div>

                          <button type="submit" class="btn mt-4">Ajouter Module</button>
                        </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
</body>
</html>
